version: '3'

vars:
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://stor:stor_dev_password@localhost:5432/stor?sslmode=disable"}}'

tasks:
  run:
    desc: Run the API locally (expects Postgres up and migrated)
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      JWT_SIGNING_KEY: 'dev-only-signing-key-not-for-production!!'
      ENV: development
    cmd: go run ./cmd/api

  test:
    desc: Run unit tests
    cmd: go test ./...

  test-integration:
    desc: Run integration tests against the compose Postgres
    env:
      TEST_DATABASE_URL: '{{.DATABASE_URL}}'
      JWT_SIGNING_KEY: 'dev-only-signing-key-not-for-production!!'
    cmd: go test -tags integration ./internal/server/...

  migrate:
    desc: Apply all pending migrations
    cmd: migrate -path migrations -database '{{.DATABASE_URL}}' up

  migrate-down:
    desc: Roll back the most recent migration
    cmd: migrate -path migrations -database '{{.DATABASE_URL}}' down 1

  sqlc:
    desc: Regenerate the store package from SQL
    cmd: sqlc generate

  vet:
    desc: Static checks
    cmds:
      - go vet ./...
      - govulncheck ./... || true

  tilt-up:
    desc: Bring up the full dev environment
    cmd: tilt up

  db-up:
    desc: Start just Postgres
    cmd: docker compose up -d db --wait
