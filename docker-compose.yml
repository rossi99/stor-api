services:
  db:
    image: postgres:16-alpine
    container_name: stor-db
    environment:
      POSTGRES_USER: stor
      POSTGRES_PASSWORD: stor_dev_password
      POSTGRES_DB: stor
    ports:
      - "5432:5432"
    volumes:
      - stor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stor -d stor"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  stor-pgdata:
