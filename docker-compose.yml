services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stor
      POSTGRES_PASSWORD: stor_dev_password
      POSTGRES_DB: stor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stor -d stor"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
